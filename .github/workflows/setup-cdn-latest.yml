name: setup-cdn-latest

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
  S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'auto' }}
  AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}

jobs:
  setup-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify CDN setup
        run: |
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ] || [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ]; then
            echo "Error: CDN (S3) environment variables are not set. Please configure the following secrets:"
            echo "- S3_ENDPOINT"
            echo "- S3_BUCKET"
            echo "- S3_ACCESS_KEY"
            echo "- S3_SECRET_KEY"
            exit 1
          fi
          echo "CDN setup verified."

      - name: Install AWS CLI
        run: |
          command -v aws || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          }

      - name: Fetch latest basix folder from CDN
        id: fetch-latest
        run: |
          # List all basix folders and sort by date to find the latest
          latest_folder=$(aws s3 ls "s3://$S3_BUCKET/basix/" | \
            grep -E 'PRE [0-9]{4}-[0-9]{2}-[0-9]{2}/' | \
            sort | \
            tail -n 1 | \
            awk '{print $2}' | \
            sed 's|/||')
          
          if [ -z "$latest_folder" ]; then
            echo "Error: No basix folders found in the CDN. Ensure the CDN contains at least one basix folder."
            exit 1
          fi
          
          echo "Latest folder: $latest_folder"
          echo "latest_folder=$latest_folder" >> $GITHUB_OUTPUT

      - name: Create "latest" redirect in CDN
        run: |
          latest_folder="${{ steps.fetch-latest.outputs.latest_folder }}"
          echo "Creating redirect from basix/latest/ to basix/$latest_folder/"
          
          # Create an HTML file with a meta refresh redirect
          echo '<html><head><meta http-equiv="refresh" content="0; url=https://$S3_BUCKET.s3.$S3_REGION.amazonaws.com/basix/'"$latest_folder"'/" /></head></html>' | \
            aws s3 cp --only-show-errors --content-type text/html - \
            "s3://$S3_BUCKET/basix/latest/index.html"
          
          echo "Redirect created successfully."