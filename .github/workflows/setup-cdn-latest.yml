name: setup-cdn-latest

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
  S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'auto' }}
  AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}

jobs:
  setup-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify CDN setup
        run: |
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ] || [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ]; then
            echo "Error: CDN (S3) environment variables are not set. Please configure the following secrets:"
            echo "- S3_ENDPOINT"
            echo "- S3_BUCKET"
            echo "- S3_ACCESS_KEY"
            echo "- S3_SECRET_KEY"
            exit 1
          fi
          echo "CDN setup verified."

      - name: Install AWS CLI
        run: |
          command -v aws || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          }

      - name: Fetch latest basix folder from CDN
        id: fetch-latest
        run: |
          # List all basix folders and sort by date to find the latest
          latest_folder=$(aws s3 ls "s3://$S3_BUCKET/basix/" | \
            grep -E 'PRE [0-9]{4}-[0-9]{2}-[0-9]{2}/' | \
            sort | \
            tail -n 1 | \
            awk '{print $2}' | \
            sed 's|/||')
          
          if [ -z "$latest_folder" ]; then
            echo "Error: No basix folders found in the CDN. Ensure the CDN contains at least one basix folder."
            exit 1
          fi
          
          echo "Latest folder: $latest_folder"
          echo "latest_folder=$latest_folder" >> $GITHUB_OUTPUT

      - name: Create "latest" redirect in CDN
        run: |
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Index of /basix/latest/</title>
              <style>
                  :root { --bg-color: #0b0f19; --card-bg: rgba(17, 24, 39, 0.7); --text-color: #e5e7eb; --accent-color: #38bdf8; --border-color: rgba(56, 189, 248, 0.2); }
                  body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 2rem; background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%); min-height: 100vh; }
                  .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
                  h1 { font-size: 1.5rem; margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; color: var(--accent-color); }
                  ul { list-style: none; padding: 0; margin: 0; }
                  li { padding: 0.75rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
                  li:last-child { border-bottom: none; }
                  a { color: var(--text-color); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: color 0.2s; }
                  a:hover { color: var(--accent-color); }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Index of /basix/latest/</h1>
                  <ul>
                      <li><a href="../">📁 ../</a></li>
                      <li><a href="basix-rootfs-latest.tar.gz">📄 basix-rootfs-latest.tar.gz</a></li>
                      <li><a href="basix-rootfs-latest.tar.gz.b3">📄 basix-rootfs-latest.tar.gz.b3</a></li>
                      <li><a href="basix-rootfs-latest.tar.gz.packages">📄 basix-rootfs-latest.tar.gz.packages</a></li>
                  </ul>
              </div>
          </body>
          </html>
          EOF

          aws s3 cp --only-show-errors --content-type text/html latest-index.html \
            "s3://$S3_BUCKET/basix/$dir/index.html"
