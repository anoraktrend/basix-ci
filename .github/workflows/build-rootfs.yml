name: build-rootfs

on:
  workflow_dispatch:

concurrency:
  group: build-rootfs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'auto' }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
      
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify CDN setup
        run: |
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ] || [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ]; then
            echo "Error: CDN (S3) environment variables are not set. Please configure the following secrets:"
            echo "- S3_ENDPOINT"
            echo "- S3_BUCKET"
            echo "- S3_ACCESS_KEY"
            echo "- S3_SECRET_KEY"
            exit 1
          fi
          echo "CDN setup verified."

      - name: Install b3sum if missing
        run: |
          command -v b3sum || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq b3sum
          }

      - name: Download and verify previous rootfs
        run: |
          # public CDN blocks datacenter IPs, so pull straight from S3
          # Fetch the latest basix folder using the same method as setup-cdn-latest
          latest_folder=$(aws s3 ls "s3://$S3_BUCKET/basix/" | \
            grep -E 'PRE [0-9]{4}-[0-9]{2}-[0-9]{2}/' | \
            sort | \
            tail -n 1 | \
            awk '{print $2}' | \
            sed 's|/||')
         
          if [ -z "$latest_folder" ]; then
            echo "No basix folders found in the CDN. This may be the first run."
            exit 0
          fi
         
          echo "Latest folder: $latest_folder"
         
          # Construct the key for the latest tarball
          date=$(echo "$latest_folder" | sed 's|-||g')
          key="basix/$latest_folder/basix-rootfs-$date.tar.gz"
         
          aws s3 cp --only-show-errors "s3://$S3_BUCKET/$key" previous.tar.gz || {
            echo "Failed to fetch previous tarball from CDN. Bailing out."
            exit 1
          }
          aws s3 cp --only-show-errors "s3://$S3_BUCKET/$key.b3" previous.tar.gz.b3 || {
            echo "Failed to fetch checksum file from CDN. Bailing out."
            exit 1
          }
      
          # Fixed indentation for verification block below
          file=$(awk 'NR==1 {print $2}' previous.tar.gz.b3)
          if [ -z "$file" ]; then
            echo "Checksum file is invalid. Bailing out."
            exit 1
          fi
          mv previous.tar.gz "$file"
          b3sum -c previous.tar.gz.b3 || {
            echo "checksum mismatch, bailing out"
            exit 1
          }

      - name: Extract previous rootfs as buildroot
        run: |
          file=$(awk 'NR==1 {print $2}' previous.tar.gz.b3)
          sudo mkdir -p buildroot
          sudo tar -xzf "$file" -C buildroot

      - name: Verify mirror overlay is in sync
        run: ./mkoverlay.sh --check

      - name: Seed repo into the buildroot
        run: |
          sudo mkdir -p buildroot/ci/out buildroot/var/cache/bpm/bin
          # this rootfs has no sh links at all, only /usr/bin/busybox
          sudo ln -sfn ../usr/bin/busybox buildroot/bin/sh
          sudo ln -sfn busybox buildroot/usr/bin/sh
          sudo cp -R basix-packages overlay buildroot/ci/
          sudo cp mkrootfs buildroot/ci/
          # the chroot needs working DNS to fetch dist_files
          sudo cp /etc/resolv.conf buildroot/etc/resolv.conf

      - name: Restore bpm binary package cache
        uses: actions/cache/restore@v5
        with:
          path: buildroot/var/cache/bpm/bin
          key: bpm-cache-v2

      - name: Restore bpm source tarball cache
        uses: actions/cache/restore@v5
        with:
          path: buildroot/var/cache/bpm/sources
          key: bpm-src-v2-${{ hashFiles('overlay/**') }}

      - name: Materialize patched bpm for the build
        run: |
          # upstream bpm tag + patches/bpm-common.sh.patch (cached-source
          # self-heal); run in place via BPM=, so the rootfs bpm package
          # itself stays pristine upstream
          sudo ./mkoverlay.sh --ci-bpm buildroot/ci/bpm-patched

      - name: Build new rootfs with mkrootfs
        run: |
          # self-bind so / is a mountpoint and unshare can set propagation
          sudo mount --bind buildroot buildroot
          sudo mount --bind /proc buildroot/proc
          sudo mount --bind /dev buildroot/dev
          sudo mount --bind /sys buildroot/sys
          d=$(date -u +%Y%m%d)
          # the date is evaluated inside the chroot: the outer $d is not in
          # scope there, so compute it on the chroot side
          sudo chroot buildroot /bin/sh -c '
            BPM_REPOS="/ci/overlay /ci/basix-packages" \
            BPM=/ci/bpm-patched/bpm \
            BPM_SANDBOX=1 \
            BPM_BUILDROOT=/newrootfs \
            BPM_USE="zlib ssl man doc -x11 -wayland -pulseaudio -bluetooth -nls" \
            /ci/mkrootfs -d /newrootfs -o /ci/out/basix-rootfs-$(date -u +%Y%m%d).tar.gz'

      - name: Retrieve artifacts from buildroot
        run: |
          d=$(date -u +%Y%m%d)
          sudo cp "buildroot/ci/out/basix-rootfs-$d.tar.gz" \
                  "buildroot/ci/out/basix-rootfs-$d.tar.gz.b3" \
                  "buildroot/ci/out/basix-rootfs-$d.tar.gz.packages" .
          ls -lh basix-rootfs-*

      - name: Save bpm binary package cache
        uses: actions/cache/save@v5
        with:
          path: buildroot/var/cache/bpm/bin
          key: bpm-cache-v2

      - name: Save bpm source tarball cache
        uses: actions/cache/save@v5
        with:
          path: buildroot/var/cache/bpm/sources
          key: bpm-src-v2-${{ hashFiles('overlay/**') }}

      - uses: actions/upload-artifact@v5
        with:
          name: basix-rootfs
          path: |
            basix-rootfs-*.tar.gz
            basix-rootfs-*.tar.gz.b3
            basix-rootfs-*.tar.gz.packages

      - name: Publish to CDN (S3-compatible)
        if: env.S3_ENDPOINT != ''
        run: |
          date=$(date -u +%Y%m%d)
          dir=$(date -u +%Y-%m-%d)
          aws s3 cp --only-show-errors --content-type application/gzip \
            "basix-rootfs-$date.tar.gz" \
            "s3://$S3_BUCKET/basix/$dir/basix-rootfs-$date.tar.gz"
          aws s3 cp --only-show-errors \
            "basix-rootfs-$date.tar.gz.b3" \
            "s3://$S3_BUCKET/basix/$dir/basix-rootfs-$date.tar.gz.b3"
          aws s3 cp --only-show-errors --content-type text/plain \
            "basix-rootfs-$date.tar.gz.packages" \
            "s3://$S3_BUCKET/basix/$dir/basix-rootfs-$date.tar.gz.packages"
          printf 'basix/%s/basix-rootfs-%s.tar.gz\n' "$dir" "$date" | \
            aws s3 cp --only-show-errors --content-type text/plain - \
            "s3://$S3_BUCKET/basix/latest-version"
          # Create a "latest" redirect link
          echo "<html><head><meta http-equiv=\"refresh\" content=\"0; url=https://$S3_BUCKET.s3.$S3_REGION.amazonaws.com/basix/$dir/\" /></head></html>" | \
            aws s3 cp --only-show-errors --content-type text/html - \
            "s3://$S3_BUCKET/basix/latest/index.html"
      
          # Generate an index.html file for the published folder
          cat <<EOF > index.html
          <!DOCTYPE html>
          <html>
          <head>
          <title>Basix RootFS - $dir</title>
          <style>
          body { font-family: Arial, sans-serif; margin: 20px; }
          h1 { color: #333; }
          ul { list-style-type: none; padding: 0; }
          li { margin: 10px 0; }
          a { color: #0066cc; text-decoration: none; }
          a:hover { text-decoration: underline; }
          </style>
          </head>
          <body>
          <h1>Basix RootFS - $dir</h1>
          <p>Download the latest rootfs artifacts:</p>
          <ul>
          <li><a href="basix-rootfs-$date.tar.gz">basix-rootfs-$date.tar.gz</a> (RootFS Tarball)</li>
          <li><a href="basix-rootfs-$date.tar.gz.b3">basix-rootfs-$date.tar.gz.b3</a> (B3 Checksum)</li>
          <li><a href="basix-rootfs-$date.tar.gz.packages">basix-rootfs-$date.tar.gz.packages</a> (Package List)</li>
          </ul>
          </body>
          </html>
          EOF
          
          # Upload index.html to S3 folder context
          aws s3 cp --only-show-errors --content-type text/html index.html "s3://$S3_BUCKET/basix/$dir/index.html"

